[project]
name = "hat-aio"
version = "0.7.13"
description = "Hat async utility library"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "http://hat-open.com"
Repository = "https://github.com/hat-open/hat-aio.git"
Documentation = "http://hat-aio.hat-open.com"

[dependency-groups]
run = []
build = ["hat-doit ~=0.16.4"]
dev = [
    {include-group = "run"},
    {include-group = "build"},
]

[build-system]
requires = ["hat-doit ~=0.16.4"]
build-backend = "hat.doit.pep517"

[tool.pytest.ini_options]
testpaths = ["test_pytest"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 300

[tool.coverage.report]
show_missing = true

[tool.coverage.run]
include = ["src_py/*"]
data_file = "build/.coverage"
